[window]
opacity = 0.90

[font]
size = 15
normal.family = "Monocraft"
bold.family = "Monocraft"
italic.family = "Monocraft"
bold_italic.family = "Monocraft"

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[scrolling]
history = 10000

[mouse]
hide_when_typing = true

[cursor]
style = "Beam"
blink_interval = 1000

[selection]
save_to_clipboard = true
