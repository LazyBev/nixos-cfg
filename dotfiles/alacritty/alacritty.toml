[window]
# Closest to glass on Niri: high transparency, no blur available.
opacity = 0.70

[terminal]
shell = { program = "fish" }

[font]
size = 15
normal.family = "Monocraft"
bold.family = "Monocraft"
italic.family = "Monocraft"
bold_italic.family = "Monocraft"

# Black Metal (Burzum) base16. Managed by hand (stylix doesn't touch this
# hjem file) — keep in sync with stylix.base16Scheme if you swap variant.
[colors.primary]
background = "#000000"
foreground = "#c1c1c1"

[colors.normal]
black = "#222222"
red = "#5f8787"
green = "#99bbaa"
yellow = "#ddeecc"
blue = "#888888"
magenta = "#999999"
cyan = "#aaaaaa"
white = "#c1c1c1"

[colors.bright]
black = "#333333"
red = "#5f8787"
green = "#99bbaa"
yellow = "#ddeecc"
blue = "#888888"
magenta = "#999999"
cyan = "#aaaaaa"
white = "#c1c1c1"

[scrolling]
history = 10000

[mouse]
hide_when_typing = true

[cursor]
style = "Beam"
blink_interval = 1000

[selection]
save_to_clipboard = true
