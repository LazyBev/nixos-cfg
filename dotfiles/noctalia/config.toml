[accessibility]
ui_scale = 0.90000000596046448

[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.079999998211860657
enabled = true
tint_intensity = 0.1099999975413084

[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.92000000000000004
    border_width = 0
    enabled = true
    layer = "top"
    margin_edge = 0
    margin_ends = 0
    padding = 12
    position = "right"
    radius = 12
    reserve_space = true
    shadow = false
    thickness = 30
    widget_spacing = 8

        [bar.main.dead_zone.actions]
        center = [ "clock" ]
        end = [ "media", "tray", "network", "volume", "battery", "control-center", "session" ]
        left = "panel-toggle launcher"
        middle = "exec alacritty"
        right = "panel-toggle control-center"
        scroll_down = "volume-down"
        scroll_up = "volume-up"
        start = [ "launcher", "workspaces" ]

[idle]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    command = "noctalia:session lock"
    enabled = true
    timeout = 600

    [idle.behavior.lock-and-suspend]
    command = "noctalia:session lock-and-suspend"
    enabled = true
    timeout = 660

    [idle.behavior.screen-off]
    command = "noctalia:dpms-off"
    enabled = true
    resume_command = "noctalia:dpms-on"
    timeout = 630

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[osd.kinds]
dnd = false

[plugins]
enabled = [
  "noctalia/bongocat",
  "noctalia/screen_recorder",
  "noctalia/timer",
  "raycursive/discord-voice",
  "h465855hgg/lyrics",
  "avivbintangaringga/nextboot-selector",
  "weinguyen/opencode-companion",
  "raycursive/niri-displays",
  "salemsayed/niri-active-workspace",
  "noctalia/notes",
  "yuuto/calculator",
  "nightwatch75/file-search",
  "blackbartblues/audio-switcher",
  "yugaaank/better-clock",
  "jinliu/imagemagick-clock",
  "noctalia/kaomoji",
]

[shell]
app_icon_colorize = true
avatar_path = "/home/yari/Pictures/matikanefuku.png"
corner_radius_scale = 2.0
font_family = "Monocraft"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/yari/Pictures"
directory_dark = "/home/yari/Pictures"
directory_light = "/home/yari/Pictures"

    [wallpaper.default]
    path = "/home/yari/.config/niri/larp.png"

    [wallpaper.last]
    path = "/home/yari/.config/niri/larp.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/yari/.config/niri/larp.png"

[widget.battery]
enabled = true

[widget.clock]
enabled = true

[widget.media]
enabled = true

[widget.network]
enabled = true

[widget.session]
enabled = true

[widget.tray]
enabled = true

[widget.volume]
enabled = true

[widget.workspaces]
enabled = true
