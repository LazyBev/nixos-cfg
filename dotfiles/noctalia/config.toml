# Noctalia config — live state snapshotted 2026-10-14, merged with curated
# extras below ([osd.kinds], [notification] mpd filter, [shell] identity).
# UI edits land in ~/.local/state/noctalia/settings.toml; re-snapshot them
# here when the setup drifts again.
config_version = 15

[accessibility]
ui_scale = 0.85

[bar.main]
position = "right"
background_opacity = 0.66
center = [ "file-search", "clock", "control-center" ]
concave_edge_corners = false
contact_shadow = true
end = [
    "media",
    "battery",
    "brightness",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "tray",
    "session"
]
font_scale = 0.76
font_weight = 600
margin_edge = 6
margin_ends = 10
padding = 15
panel_overlap = 0
radius = 80
radius_bottom_left = 80
radius_top_left = 80
radius_top_right = 80
start = [ "workspaces", "ambient-sounds", "notes" ]
thickness = 40
widget_spacing = 6

[brightness]
sync_all_monitors = true

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 730.0
    cy = 396.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "tausif/ncs-visualizer:orb"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 128.0
    box_width = 304.0
    cx = 168.0
    cy = 84.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

[dock]
item_spacing = 0
shadow = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 957.0
    output = "HDMI-A-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 957.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [
    "noctalia/bongocat",
    "noctalia/screen_recorder",
    "noctalia/timer",
    "raycursive/discord-voice",
    "h465855hgg/lyrics",
    "avivbintangaringga/nextboot-selector",
    "weinguyen/opencode-companion",
    "raycursive/niri-displays",
    "salemsayed/niri-active-workspace",
    "noctalia/notes",
    "yuuto/calculator",
    "nightwatch75/file-search",
    "blackbartblues/audio-switcher",
    "yugaaank/better-clock",
    "jinliu/imagemagick-clock",
    "noctalia/kaomoji",
    "aabidk20/yt-music",
    "al3x/visualizerp",
    "danielel/owntone-control",
    "reaperhound/ambient-sounds",
    "piero-93/battery-power-management",
    "dumbasaroc/bazaarsearch",
    "dragged/cider",
    "liamwh/emoji-picker",
    "pk/geoip-monitor"
]

[shell]
app_icon_colorize = true
avatar_path = "/home/yari/Pictures/matikanefuku.png"
corner_radius_scale = 2.0
font_family = "Monocraft"
niri_overview_type_to_launch_enabled = true
popup_shadows = false

[shell.panel]
shadow = false
transparency_mode = "glass"

[shell.shadow]
alpha = 1.0
direction = "left"

[theme]
custom_palette = "dark-eva-mo"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-monochrome"

[wallpaper]
directory = "/home/yari/Pictures"
directory_dark = "/home/yari/Pictures"
directory_light = "/home/yari/Pictures"

    [wallpaper.default]
    path = "/home/yari/Pictures/dark-eva.png"

    [wallpaper.last]
    path = "/home/yari/Pictures/dark-eva.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/yari/Pictures/dark-eva.png"

[widget.ambient-sounds]
type = "reaperhound/ambient-sounds:ambient-sounds"

[widget.battery]
enabled = true

[widget.clock]
enabled = true
format = "{:%H:%M:%S}"

[widget.file-search]
type = "nightwatch75/file-search:file-search"

[widget.media]
enabled = true

[widget.network]
enabled = true

[widget.notes]
type = "noctalia/notes:notes"

[widget.session]
enabled = true

[widget.tray]
enabled = true

[widget.volume]
enabled = true

[widget.workspaces]
enabled = true

[osd.kinds]
dnd = false

# mpdris2 sends transient track-change toasts as "Music Player Daemon"
# (verified over D-Bus; transient = never stored, hence invisible history).
[notification]
filter_order = ["no-mpd-toasts"]

[notification.filter.no-mpd-toasts]
enabled = true
match = "Music Player Daemon"
show_toast = false
save_history = false
play_sound = false
