background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    contrast = 0.5
    brightness = 0.3
    color = #000000
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 0
    dots_size = 0.3
    dots_spacing = 0.4
    dots_center = true
    outer_color = #00000000
    inner_color = #00000000
    font_color = #ffffff
    fade_on_empty = false
    placeholder_text = <span font_family="monospace" font_weight="bold">password:</span>
    hide_input = false
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date "+%H:%M"
    color = #ffffff
    font_size = 72
    font_family = monospace
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date "+%A, %d %B %Y"
    color = #999999
    font_size = 16
    font_family = monospace
    position = 0, -30
    halign = center
    valign = center
}
