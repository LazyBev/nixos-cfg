[language-server.asm-lsp]
command = "asm-lsp"

[[language]]
name = "asm"
scope = "source.asm"
language-servers = ["asm-lsp"]
file-types = ["asm", "s", "S", "fasm"]

[[language]]
name = "nix"
scope = "source.nix"
auto-format = true
formatter = { command = "nixfmt", args = [] }

[[language]]
name = "rust"
scope = "source.rust"
auto-format = true

[[language]]
name = "odin"
scope = "source.odin"
file-types = ["odin"]
language-servers = ["ols"]

[language-server.ols]
command = "ols"

[[language]]
name = "zig"
scope = "source.zig"
file-types = ["zig"]

[grammar]
name = "rust"
source = { git = "https://github.com/tree-sitter/tree-sitter-rust", rev = "v0.21.0" }

